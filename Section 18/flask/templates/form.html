<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Form - Modern Flask App</title>
    <!-- Importing the 'Inter' font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        /* --- Root Variables (Same as modern.html) --- */
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --secondary-color: #03dac6;
            --text-color: #e0e0e0;
            --text-muted: #888;
            --gradient-start: #8e2de2;
            --gradient-end: #4a00e0;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
        }

        /* --- Navbar (Same as modern.html) --- */
        .navbar {
            background: rgba(30, 30, 30, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .navbar-nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.5rem 1rem;
            transition: color 0.3s ease;
        }

        .navbar-nav a:hover {
            color: var(--text-color);
        }
        
        /* Highlight the new 'Form' link */
        .navbar-nav a[href="/form"] {
            color: var(--secondary-color);
            font-weight: 500;
        }

        /* --- Main Container --- */
        .container {
            max-width: 700px; /* Forms look better a bit narrower */
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* --- Form Card --- */
        .form-card {
            background: rgba(30, 30, 30, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 2.5rem;
        }

        .form-title {
            font-size: 2rem;
            font-weight: 500;
            color: var(--primary-color);
            text-align: center;
            margin-top: 0;
            margin-bottom: 2rem;
        }

        /* --- Form Elements --- */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .form-input {
            width: 100%;
            padding: 0.9rem 1rem;
            font-size: 1rem;
            color: var(--text-color);
            background-color: var(--surface-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(3, 218, 198, 0.3);
        }

        /* --- Gradient Button (from modern.html) --- */
        .btn {
            display: inline-block;
            width: 100%; /* Make button full-width */
            background-image: linear-gradient(45deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            color: white;
            padding: 0.9rem 1.5rem;
            text-decoration: none;
            border-radius: 25px; /* Pill shape */
            font-weight: 500;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        /* --- Footer --- */
        .footer {
            text-align: center;
            padding: 2rem 0;
            margin-top: 3rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="navbar">
        <a href="/" class="navbar-brand">Flask/Modern</a>
        <nav class="navbar-nav">
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/form">Form</a> <!-- Added link -->
            <a href="/profile">Profile</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container">

        <div class="form-card">
            <h1 class="form-title">Submit Your Name</h1>
            
            <!-- 
              - 'action="/form"' tells the form to submit to the same URL.
              - 'method="POST"' tells the form to send data as a POST request.
            -->
            <form action="/submit" method="POST">
                
                <div class="form-group">
                    <label for="name" class="form-label">Name</label>
                    <!-- 'name="name"' is crucial. This is the key Flask uses (request.form['name']) -->
                    <input type="text" id="name" name="name" class="form-input" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn">Submit</button>
                </div>

            </form>
        </div>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2025 Your App. Built with Flask.</p>
    </footer>

</body>
</html>
