<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Result - Modern Flask App</title>
    <!-- Importing the 'Inter' font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        /* --- Root Variables (Same as modern.html) --- */
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --secondary-color: #03dac6; /* Using this for PASS */
            --error-color: #cf6679;    /* Using this for FAIL */
            --text-color: #e0e0e0;
            --text-muted: #888;
            --gradient-start: #8e2de2;
            --gradient-end: #4a00e0;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
        }

        /* --- Navbar (Same as modern.html) --- */
        .navbar {
            background: rgba(30, 30, 30, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .navbar-nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.5rem 1rem;
            transition: color 0.3s ease;
        }

        .navbar-nav a:hover {
            color: var(--text-color);
        }
        
        /* --- Main Container --- */
        .container {
            max-width: 700px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* --- Result Card --- */
        .result-card {
            background: rgba(30, 30, 30, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 3rem;
            text-align: center;
        }

        .result-title {
            font-size: 1.5rem;
            font-weight: 300;
            color: var(--text-muted);
            margin-top: 0;
            margin-bottom: 1rem;
        }

        .result-text {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 2rem;
        }

        /* --- Dynamic Colors based on Jinja2 variable --- */
        .result-text-pass {
            color: var(--secondary-color);
        }
        
        .result-text-fail {
            color: var(--error-color);
        }
        
        .result-icon {
            font-size: 4rem;
            line-height: 1;
            margin-bottom: 1rem;
        }

        /* --- Button --- */
        .btn {
            display: inline-block;
            background-image: linear-gradient(45deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            color: white;
            padding: 0.9rem 1.5rem;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 500;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        /* --- Footer --- */
        .footer {
            text-align: center;
            padding: 2rem 0;
            margin-top: 3rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="navbar">
        <a href="/" class="navbar-brand">Flask/Modern</a>
        <nav class="navbar-nav">
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/form">Form</a>
            <a href="/profile">Profile</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container">

        <div class="result-card">
            
            <h1 class="result-title">Your Result is:</h1>
            
            <!-- 
              This is the Jinja2 template logic.
              It checks the 'results' variable from Flask
              and applies a different class and text.
            -->
            {% if results == "PASS" %}
                
                <div class="result-icon">✓</div>
                <h2 class="result-text result-text-pass">{{ results }}</h2>
                <p style="color: var(--text-muted); margin-bottom: 2rem;">Congratulations! You met the required score.</p>
                
            {% else %}

                <div class="result-icon" style="color: var(--error-color);">✗</div>
                <h2 class="result-text result-text-fail">{{ results }}</h2>
                <p style="color: var(--text-muted); margin-bottom: 2rem;">Unfortunately, you did not meet the required score.</p>

            {% endif %}
            
            <a href="/" class="btn">Back to Home</a>

        </div>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2025 Your App. Built with Flask.</p>
    </footer>

</body>
</html>
